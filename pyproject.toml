[project]
name = "agenticaichatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vikas kesharvani", email = "vikashkesharvani62@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-litellm>=0.11.0",
    "langchain-openai>=1.6.7",
    "langchainhub>=0.1.21",
    "langgraph>=1.2.12",
    "litellm>=1.103.2",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.4",
]

[project.scripts]
agenticaichatbot = "agenticaichatbot:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
